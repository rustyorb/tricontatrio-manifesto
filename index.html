<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRICONTATRIO · A Cartography of 33</title>
    <meta name="description" content="A dense, one-page cartography of the number 33: mathematics, the sum of three cubes, the human spine, arsenic, the cosmos and culture." />
    <meta name="theme-color" content="#121212" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="TRICONTATRIO · A Cartography of 33" />
    <meta property="og:description" content="A dense, one-page cartography of the number 33." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.milorbs.com/" />
    <meta property="og:image" content="https://www.milorbs.com/images/crystal-33.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.goatcounter = {
        no_onload: true,
        path: window.location.pathname,
        referrer: document.referrer ? new URL(document.referrer).origin : "",
        start: function () {
          if (this.started || !["www.milorbs.com", "milorbs.com"].includes(window.location.host)) return;
          this.started = true;

          // GoatCounter also sends a separate query field; keep URL secrets out.
          const getData = this.get_data;
          this.get_data = function (vars) {
            const data = getData(vars);
            delete data.q;
            return data;
          };

          const countWhenVisible = () => {
            if (document.visibilityState && document.visibilityState !== "visible") return;
            document.removeEventListener("visibilitychange", countWhenVisible);
            this.count();
          };
          if (document.visibilityState && document.visibilityState !== "visible") {
            document.addEventListener("visibilitychange", countWhenVisible);
          } else {
            countWhenVisible();
          }
        },
      };
    </script>
    <script data-goatcounter="https://tirdytree.goatcounter.com/count" async src="https://gc.zgo.at/count.js" onload="window.goatcounter.start()"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
